name: CI

# Runs automatically on every push and pull request; can also be started by
# hand from the "Actions" tab (see the README, section "GitHub Actions").
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

# The default token only needs read access to the repository contents.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build and run the verification suite on Linux, macOS and Windows.
  # ---------------------------------------------------------------------------
  build-and-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run the verification suite (full, includes exhaustive n = 10)
        shell: bash
        run: ctest --test-dir build -C Release -V 2>&1 | tee ctest.log

      - name: Publish the test result to the run summary
        if: always()
        shell: bash
        run: |
          {
            echo '## heaps_unrank verification suite'
            echo
            echo '```'
            grep -E '\[(PASS|FAIL)\]|ALL CHECKS|FAILURES' ctest.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 2. The library must compile warning-free under a strict warning set.
  # ---------------------------------------------------------------------------
  strict-warnings:
    name: strict warnings (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [ g++, clang++ ]
    steps:
      - uses: actions/checkout@v7

      - name: Compile with -Wall -Wextra -Wpedantic -Werror
        run: |
          for f in heaps_unrank.cpp heaps_unrank_o_n3.cpp bench_heaps.cpp test_heaps_unrank.cpp; do
            ${{ matrix.cxx }} -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -I. \
              -c "$f" -o "/tmp/${f%.cpp}.o"
          done

  # ---------------------------------------------------------------------------
  # 3. AddressSanitizer + UndefinedBehaviorSanitizer on the whole suite.
  # ---------------------------------------------------------------------------
  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build with sanitizers
        run: |
          g++ -std=c++17 -O1 -g -fsanitize=address,undefined \
              -fno-omit-frame-pointer -Wall -Wextra -I. \
              heaps_unrank.cpp heaps_unrank_o_n3.cpp test_heaps_unrank.cpp -o test_san

      - name: Run
        shell: bash
        run: ./test_san 2>&1 | tee sanitizer.log

      - name: Publish the test result to the run summary
        if: always()
        shell: bash
        run: |
          {
            echo '## ASan + UBSan run'
            echo
            echo '```'
            grep -E '\[(PASS|FAIL)\]|ALL CHECKS|FAILURES|runtime error|AddressSanitizer' sanitizer.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
